name: Deploy ranking site to Pages

# Build the static site from the committed data.json and publish to GitHub
# Pages. CI does NOT scrape (no browser/Cloudflare in the runner) -- the Mac
# refresh commits a fresh data.json, which this workflow deploys.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pin a stable npm (runner npm crashes on Node 24)
        run: npm install -g npm@10.9.2
      - name: Install deps
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Build static site
        working-directory: web
        env:
          BASE_PATH: /adcc-rankings
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
